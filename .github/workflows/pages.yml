name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 21:30 UTC on Sun-Thu is 06:30 JST on Mon-Fri.
    - cron: "30 21 * * 0-4"

permissions:
  contents: write

concurrency:
  group: morning-alpha-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Export briefing JSON
        run: npm run export
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'auto' }}
      - name: Validate generated briefing
        run: |
          node -e "const fs=require('fs');const p='public/data/briefing.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(!d.generatedAtTokyo||!Array.isArray(d.markets)||!Array.isArray(d.news))throw new Error('Generated briefing is incomplete');console.log('[briefing] generatedAtTokyo=',d.generatedAtTokyo);console.log('[briefing] summarySource=',d.summarySource);console.log('[briefing] newsLive=',d.status?.newsLive,'marketLive=',d.status?.marketLive);"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('public/data/briefing.json','utf8'));if(!d.status?.marketLive)process.exit(0);for(const m of d.markets){const labels=(m.points||[]).map(p=>p.label);if(labels.length!==new Set(labels).size)throw new Error(m.name+': duplicate market dates');if(!Number.isFinite(Number(m.previousClose)))throw new Error(m.name+': previous close missing');const expected=(Number(m.change)/Number(m.previousClose))*100;if(Math.abs(expected-Number(m.changePct))>=0.011)throw new Error(m.name+': day-over-day ratio mismatch');}console.log('[briefing] market points and day-over-day changes validated');"
      - name: Check browser scripts
        run: node --check public/app.js && node --check public/design.js
      - name: Publish static site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/pages-site
          mkdir -p /tmp/pages-site
          cp -R public/. /tmp/pages-site/
          touch /tmp/pages-site/.nojekyll
          cd /tmp/pages-site
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Pages site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
